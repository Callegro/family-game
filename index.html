}));

<script>
(()=>{
'use strict';
const {COUNTRIES,REGIONS,findCountry}=window.GameCatalog;
const STORAGE_KEY='family-dressup-prototype-state-v1';
const ROLES=[
  {id:'grandpa',label:'할아버지',symbol:'👴',type:'person',group:'grand'},
  {id:'grandma',label:'할머니',symbol:'👵',type:'person',group:'grand'},
  {id:'adult_m',label:'남자 성인',symbol:'🧑',type:'person',group:'adult'},
  {id:'adult_f',label:'여자 성인',symbol:'👩',type:'person',group:'adult'},
  {id:'student_m',label:'남자 학생',symbol:'🎒',type:'person',group:'child'},
  {id:'student_f',label:'여자 학생',symbol:'📚',type:'person',group:'child'},
  {id:'child_m',label:'남자아이',symbol:'🧒',type:'person',group:'child'},
  {id:'child_f',label:'여자아이',symbol:'🪁',type:'person',group:'child'},
  {id:'dog',label:'강아지',symbol:'🐶',type:'pet',group:'pet'},
  {id:'cat',label:'고양이',symbol:'🐱',type:'pet',group:'pet'}
];
const SKINS=[{name:'밝은 피부',hex:'#f6d5b8'},{name:'살구빛 피부',hex:'#edbb98'},{name:'황갈색 피부',hex:'#d99c70'},{name:'갈색 피부',hex:'#ae7659'},{name:'진한 갈색 피부',hex:'#84543d'},{name:'짙은 피부',hex:'#5b392e'}];
const FURS=[{name:'크림색',hex:'#f3d4a4'},{name:'연갈색',hex:'#c89a73'},{name:'검정색',hex:'#5a5260'},{name:'회색',hex:'#acb5bc'},{name:'흰색',hex:'#f1e8e6'},{name:'황갈색',hex:'#ac7550'}];
const HAIR_COLORS=[{name:'검정색',hex:'#36303b'},{name:'짙은 갈색',hex:'#655146'},{name:'갈색',hex:'#a17354'},{name:'금발',hex:'#d8ac5a'},{name:'붉은색',hex:'#ad5f54'},{name:'은회색',hex:'#a5a6b4'}];
const HAIRS=[{id:'short',label:'짧은 머리'},{id:'long',label:'긴 머리'},{id:'bob',label:'단발머리'},{id:'curl',label:'곱슬머리'},{id:'up',label:'묶은 머리'},{id:'bald',label:'민머리'}];
const SHAPES=[{id:'round',label:'동그란 얼굴'},{id:'oval',label:'갸름한 얼굴'},{id:'square',label:'네모난 얼굴'},{id:'heart',label:'하트 얼굴'}];
const FACES=[{id:'smile',label:'방긋 웃는 얼굴'},{id:'happy',label:'활짝 웃는 얼굴'},{id:'wink',label:'윙크 얼굴'},{id:'calm',label:'차분한 얼굴'}];
const CLOTH_COLORS=[{name:'딸기 분홍',hex:'#e9a1b5',dark:'#c97a9b'},{name:'라벤더',hex:'#aa99e8',dark:'#8270c8'},{name:'하늘 파랑',hex:'#86c0e9',dark:'#659cd4'},{name:'민트 초록',hex:'#84cda9',dark:'#61ab8d'},{name:'햇살 노랑',hex:'#efc777',dark:'#d8a44d'},{name:'복숭아',hex:'#e99a83',dark:'#c87d6c'}];
const STEPS=['이름 정하기','가족 만들기','나라 고르기','옷 입히기','가족 여행'];
const $app=document.getElementById('app');
const $toast=document.getElementById('toast');
let toastTimer=0;
let ui={region:'전체',search:'',selectedMemberId:null,selectedDressId:null};
let state=loadState();

function escapeHTML(input){return String(input??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function safeHex(s,fallback){return /^#[0-9a-fA-F]{6}$/.test(s||'')?s:fallback;}
function roleOf(m){return ROLES.find(r=>r.id===m.role) || ROLES[2];}
function typeOf(m){return roleOf(m).type;}
function defaultState(){return {version:1,step:0,playerName:'',members:[],countryId:null};}
function loadState(){
  try{
    const v=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');
    if(!v||v.version!==1||!Array.isArray(v.members))return defaultState();
    const members=v.members.filter(m=>m&&ROLES.some(r=>r.id===m.role)).slice(0,24).map(m=>({
      id:String(m.id||makeId()),role:m.role,nickname:String(m.nickname||'').slice(0,18),skin:Number.isInteger(m.skin)?Math.max(0,Math.min(5,m.skin)):1,
      hair:HAIRS.some(h=>h.id===m.hair)?m.hair:'short',hairColor:Number.isInteger(m.hairColor)?Math.max(0,Math.min(5,m.hairColor)):0,
      face:FACES.some(f=>f.id===m.face)?m.face:'smile',shape:SHAPES.some(f=>f.id===m.shape)?m.shape:'round',outfitId:String(m.outfitId||''),clothColor:Number.isInteger(m.clothColor)?Math.max(0,Math.min(5,m.clothColor)):0,
      accessoryId:String(m.accessoryId||'')
    }));
    return {version:1,step:Math.max(0,Math.min(4,Number(v.step)||0)),playerName:String(v.playerName||'').slice(0,20),members,countryId:findCountry(v.countryId)?v.countryId:null};
  }catch(e){return defaultState();}
}
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch(e){/* private mode or file protocol restrictions */}}
function makeId(){return `${Date.now().toString(36)}-${Math.random().toString(36).slice(2,9)}`;}
function toast(message){$toast.textContent=message;$toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$toast.classList.remove('show'),3000);}
function notifyAndRender(message){save();render();if(message)toast(message);}
function currentCountry(){return findCountry(state.countryId);}
function memberName(m){return m.nickname?.trim()||`${roleOf(m).label} ${state.members.filter(x=>x.role===m.role).findIndex(x=>x.id===m.id)+1}`;}
function isDressed(m){const country=currentCountry();return typeOf(m)==='pet'||!!country?.outfits.some(o=>o.id===m.outfitId);}
function personMembers(){return state.members.filter(m=>typeOf(m)==='person');}
function dressProgress(){const people=personMembers();return {total:people.length,done:people.filter(isDressed).length};}
function familyInfo(){
  const people=state.members.filter(m=>typeOf(m)==='person');
  const adults=people.filter(m=>roleOf(m).group==='adult').length;
  const children=people.filter(m=>roleOf(m).group==='child').length;
  const grands=people.filter(m=>roleOf(m).group==='grand').length;
  const pets=state.members.length-people.length;
  let type='아직 가족을 만들지 않았어요';
  if(people.length===0&&pets>0)type='반려동물 가족';
  else if(grands>0&&children>0&&adults===0)type='조손가족';
  else if(grands>0&&(adults>0||children>0))type='대가족';
  else if(adults>=3)type='대가족';
  else if(adults===1&&children>0)type='한부모가족';
  else if(adults===2&&children>0)type='핵가족';
  else if(adults>=1&&children===0)type='성인 가족';
  else if(children>0)type='다양한 가족';
  else if(grands>0)type='조부모 가족';
  return {type,people:people.length,pets};
}
function displayRole(m){const role=roleOf(m);return role.label;}
function dollMarkup(m){
  const role=roleOf(m),pet=role.type==='pet',country=currentCountry(),outfit=country?.outfits.find(o=>o.id===m.outfitId),acc=country?.accessories.find(a=>a.id===m.accessoryId);
  const palette=CLOTH_COLORS[m.clothColor]||CLOTH_COLORS[0];
  const skin=pet?(FURS[m.skin]||FURS[0]).hex:(SKINS[m.skin]||SKINS[1]).hex;
  const hair=HAIR_COLORS[m.hairColor]?.hex||HAIR_COLORS[0].hex;
  const face=FACES.some(x=>x.id===m.face)?m.face:'smile';
  const shape=SHAPES.some(x=>x.id===m.shape)?m.shape:'round';
  return `<div class="doll-wrap"><div class="doll ${pet?'pet '+(m.role==='cat'?'cat':'dog'):''} hair-${escapeHTML(m.hair)} face-${escapeHTML(face)} shape-${escapeHTML(shape)}" style="--skin:${safeHex(skin,'#dfaf86')};--hair:${safeHex(hair,'#55443a')};--cloth:${safeHex(palette.hex,'#d19ee0')};--cloth-dark:${safeHex(palette.dark,'#a474c4')}" role="img" aria-label="${escapeHTML(memberName(m))}, ${escapeHTML(outfit?.label||'기본 의상')}">
    ${pet?`<div class="pet-tail"></div><div class="pet-ear"></div><div class="pet-ear right"></div><div class="pet-body"></div><div class="pet-head"></div><div class="pet-eye"></div><div class="pet-eye right"></div><div class="pet-nose"></div><div class="pet-paw"></div><div class="pet-paw right"></div><div class="pet-collar"></div>`
    :`<div class="hair-back"></div><div class="arm left"></div><div class="arm right"></div><div class="neck"></div><div class="leg"></div><div class="leg right"></div><div class="shoe"></div><div class="shoe right"></div><div class="shirt"></div><div class="head"><span class="eye left"></span><span class="eye right"></span><span class="cheek left"></span><span class="cheek right"></span><span class="mouth"></span></div><div class="hair-front"></div>${outfit?'<div class="costume"></div>':''}`}
    ${acc?'<div class="accessory" aria-hidden="true">✿</div>':''}<div class="doll-ground"></div></div></div>`;
}
function sidebar(){const f=familyInfo();return `<aside class="family-panel" aria-label="현재 가족판"><div class="sidebar-head"><h3>🏠 우리 가족판</h3><span class="tiny-pill">${state.members.length}명 / 마리</span></div><div class="family-type"><span class="eyebrow">우리 가족의 모습</span><strong>${escapeHTML(f.type)}</strong><p>사람 ${f.people}명 · 반려동물 ${f.pets}마리</p></div><div class="family-mini-grid">${state.members.length?state.members.map(m=>`<div class="family-mini">${dollMarkup(m)}<b title="${escapeHTML(memberName(m))}">${escapeHTML(memberName(m))}</b><small>${isDressed(m)&&currentCountry()?'꾸몄어요 ✨':displayRole(m)}</small></div>`).join(''):'<div class="empty-mini">구성원을 추가하면<br>여기에 나타나요 ♡</div>'}</div><p class="helper-note">* 가족 유형은 선택한 역할만으로 추정한 게임 속 분류예요. 실제 가족의 관계와 형태는 더 다양해요.</p></aside>`;}

function memberTabs(){return `<div class="member-strip" aria-label="우리 가족 구성원">${state.members.map(m=>`<button class="member-card ${ui.selectedMemberId===m.id?'selected':''}" data-action="choose-member" data-id="${escapeHTML(m.id)}" aria-pressed="${ui.selectedMemberId===m.id}">${dollMarkup(m)}<b>${escapeHTML(memberName(m))}</b><small>${escapeHTML(roleOf(m).label)}</small></button>`).join('')}</div>`;}
function paintSwatches(items,value,key){return `<div class="swatches" role="group" aria-label="${key==='skin'?'피부색 또는 털 색':key==='hairColor'?'머리 색':'옷 색'}">${items.map((item,index)=>`<button type="button" data-action="style" data-field="${key}" data-value="${index}" class="swatch ${index===value?'selected':''}" style="--swatch:${item.hex}" aria-label="${item.name}" title="${item.name}" aria-pressed="${index===value}"></button>`).join('')}</div>`;}

function editor(m){const pet=typeOf(m)==='pet';return `<div class="editor"><div class="editor-header"><h3>🎨 ${escapeHTML(memberName(m))} 꾸미기</h3><button class="btn btn-small btn-danger" data-action="remove-member" data-id="${escapeHTML(m.id)}">구성원 삭제</button></div><div class="editor-content"><div class="editor-preview">${dollMarkup(m)}</div><div class="editor-controls"><div class="field-row"><div class="field"><label for="member-nickname">이름 또는 별명 (선택)</label><input class="small-input" id="member-nickname" data-field="nickname" maxlength="18" placeholder="예: 엄마, 민지, 코코" value="${escapeHTML(m.nickname)}"></div><div class="field"><label>얼굴 모양</label>${fieldSelect(SHAPES,m.shape,'shape')}</div></div><div class="field" style="margin-bottom:12px"><label>얼굴 표정</label>${fieldSelect(FACES,m.face,'face')}</div><div class="field"><label>${pet?'털 색':'피부색'}</label>${paintSwatches(pet?FURS:SKINS,m.skin,'skin')}</div>${pet?'':`<div class="field-row" style="margin-top:12px"><div class="field"><label>머리 스타일</label>${fieldSelect(HAIRS,m.hair,'hair')}</div><div class="field"><label>머리 색깔</label>${paintSwatches(HAIR_COLORS,m.hairColor,'hairColor')}</div></div>`}</div></div><p class="helper-note">${pet?'반려동물은 기본 목걸이를 하고 있어요.':'모든 캐릭터는 처음에 흰 티셔츠와 바지를 입고 있어요.'}</p></div>`;}
function familyBuilder(){if(!state.members.some(m=>m.id===ui.selectedMemberId))ui.selectedMemberId=state.members[0]?.id||null;const m=state.members.find(m=>m.id===ui.selectedMemberId);

function countryCards(){const query=ui.search.trim().toLocaleLowerCase();const filtered=COUNTRIES.filter(c=>(ui.region==='전체'||c.region===ui.region)&&(!query||[c.name,c.capital,...c.outfits.map(o=>o.label)].join(' ').toLocaleLowerCase().includes(query)));

}
function countrySelect(){const c=currentCountry();return `<div class="section-title"><span class="kicker">STEP 3 · 어디로 여행 갈까?</span><h2>우리 가족 모두 같은 나라의 옷을 입어요!</h2><p>${COUNTRIES.length}개 나라 중 하나를 고르면 그 나라의 전통의상을 여러 가지 입어 볼 수 있어요.</p></div><div class="country-toolbar"><div class="chips" role="group" aria-label="나라별 분류">${REGIONS.map(r=>`<button class="chip ${ui.region===r?'selected':''}" data-action="region" data-region="${r}" aria-pressed="${ui.region===r}">${r}</button>`).join('')}</div><input id="country-search" class="text-input country-search" placeholder="나라·옷 이름 검색 🔎" value="${escapeHTML(ui.search)}" aria-label="나라 검색"></div><div class="country-grid" id="country-grid">${countryCards()}</div><div class="country-footer"><div class="selected-country">${c?`${c.flag} ${c.name} · ${c.capital}`:'아직 나라를 고르지 않았어요'}<span>${c?`${c.outfits.map(o=>o.label).slice(0,3).join(' · ')} 외`:'어떤 나라로 여행할까요?'}</span></div><span class="counter">${COUNTRIES.length}개 나라</span></div>${c?`<div class="notice">문화 안내: ${escapeHTML(c.note)} 한 나라 안에도 다양한 지역·공동체·시대의 전통의상이 있어요.</div>`:''}<div class="primary-actions"><button class="btn btn-white" data-action="go" data-step="1">← 가족 고치기</button><button class="btn btn-primary" data-action="go" data-step="3" ${!c?'disabled':''}>옷입히기 시작 →</button></div>`;}
function outfitBtn(outfit,m,index){const active=m.outfitId===outfit.id;const color=CLOTH_COLORS[index%CLOTH_COLORS.length].hex;return `<button class="option-card ${active?'selected':''}" data-action="outfit" data-id="${outfit.id}" aria-pressed="${active}"><span class="option-icon" style="--outfit-color:${color}">✿</span><span><strong>${escapeHTML(outfit.label)}</strong><small>${active?'입고 있어요! ✨':'눌러서 입혀 주세요'}</small></span></button>`;}
function accessoryButtons(c,m){return `<div class="chips">${[{id:'',label:'장식 없음'},...c.accessories].map(a=>`<button class="chip ${m.accessoryId===a.id?'selected':''}" data-action="accessory" data-id="${escapeHTML(a.id)}" aria-pressed="${m.accessoryId===a.id}">${escapeHTML(a.label)}</button>`).join('')}</div>`;}
function dress(){const c=currentCountry();if(!c)return countrySelect();if(!state.members.some(m=>m.id===ui.selectedDressId))ui.selectedDressId=state.members.find(m=>typeOf(m)==='person')?.id||state.members[0]?.id;const m=state.members.find(x=>x.id===ui.selectedDressId);if(!m)return familyBuilder();const pet=typeOf(m)==='pet';const progress=dressProgress();const percent=progress.total?Math.round(100*progress.done/progress.total):0;
return `<div class="section-title"><span class="kicker">STEP 4 · 알록달록 전통 옷입히기</span><div class="dress-header"><div><h2>${c.flag} ${c.name} 옷가게에 오신 걸 환영해요!</h2><p>한 명씩 눌러서 의상과 소품을 골라 주세요.</p></div><button class="btn btn-small btn-white" data-action="go" data-step="2">나라 바꾸기</button></div></div><div><div class="select-title">우리 가족 <span class="family-count">옷 입힌 사람 ${progress.done} / ${progress.total}</span></div><div class="progress-shell" aria-label="옷입히기 진행 ${percent}%"><div class="progress-fill" style="width:${percent}%"></div></div>${`<div class="member-strip" style="margin-top:11px">${state.members.map(p=>`<button class="member-card ${ui.selectedDressId===p.id?'selected':''}" data-action="dress-member" data-id="${escapeHTML(p.id)}" aria-pressed="${ui.selectedDressId===p.id}">${dollMarkup(p)}<b>${escapeHTML(memberName(p))}</b><small>${typeOf(p)==='pet'?'함께 여행해요 🐾':isDressed(p)?'완료 ✓':'의상 고르기'}</small></button>`).join('')}</div>`}</div><div class="dress-area"><div class="big-stage"><div class="floating-sticker">${c.flag} ${escapeHTML(c.name)}</div>${dollMarkup(m)}<strong>${escapeHTML(memberName(m))}</strong><span>${pet?'동물 친구의 장식을 골라요!':c.outfits.find(o=>o.id===m.outfitId)?.label||'아직 흰 티셔츠와 바지를 입고 있어요'}</span></div><div class="dress-picks">${pet?'<div class="pet-info">🐾 강아지와 고양이는 사람의 전통의상 대신, 여행 분위기에 어울리는 장식 소품을 골라요.</div>':`<h3>👘 전통의상 고르기</h3><div class="outfit-grid">${c.outfits.map((o,i)=>outfitBtn(o,m,i)).join('')}</div><div style="margin-top:15px"><div class="select-title">옷 색깔 고르기</div>${paintSwatches(CLOTH_COLORS,m.clothColor,'clothColor')}</div>`}<div class="select-title" style="margin-top:17px">✨ ${pet?'장식 소품':'어울리는 소품'} 고르기</div>${accessoryButtons(c,m)}<div class="selected-description">${pet?'반려동물은 가족과 같은 나라로 여행하지만 사람 전통의상을 착용하지 않아요.':`선택한 의상: <b>${escapeHTML(c.outfits.find(o=>o.id===m.outfitId)?.label||'아직 선택 전')}</b><br>`}문화 이야기: ${escapeHTML(c.note)}</div><div class="btn-row"><button class="btn btn-soft" data-action="next-member">다음 가족 꾸미기 →</button></div></div></div><div class="finish-wrap"><div class="primary-actions" style="margin:0"><div><strong>${progress.done===progress.total?'✨ 모두 옷을 입었어요!':'조금만 더 꾸며 볼까요?'}</strong><p>${progress.done===progress.total?'우리 가족 여행 장면을 만나 봐요.':'모든 사람에게 전통의상을 하나씩 입혀 주세요.'}</p></div><button class="btn btn-primary" data-action="finish" ${progress.done!==progress.total||progress.total===0?'disabled':''}>가족 여행 영상 보기 🎬 →</button></div></div>`;}
function storyText(){const c=currentCountry();if(!c)return '';const unique=[...new Set(personMembers().map(m=>c.outfits.find(o=>o.id===m.outfitId)?.label).filter(Boolean))];const garment=unique.length===1?unique[0]:unique.length===2?`${unique[0]}와 ${unique[1]}`:`${unique.slice(0,2).join(', ')} 등 여러 전통의상`;
return `${state.playerName}의 가족은 ${c.name}의 ${garment} 같은 전통의상을 입고, ${c.name}의 수도인 ${c.capital}로 신나는 여행을 떠났어요!`;
}
function ending(){const c=currentCountry();if(!c)return countrySelect();const copy=storyText();return `<div class="section-title"><span class="kicker">STEP 5 · 우리 가족 여행 이야기</span><h2>짜잔! ${escapeHTML(state.playerName)}의 가족이 여행을 떠나요! 🎉</h2><p>캐릭터들이 함께 걸어가는 애니메이션이에요. 실제 영상 파일은 아직 만들지 않았어요.</p></div><div class="ending-stage" aria-label="가족 여행 걷기 애니메이션"><div class="floating-sticker">${c.flag} ${escapeHTML(c.name)} 여행!</div><div class="sun"></div><div class="ending-city">${escapeHTML(c.capital)}에 도착했어요!</div><div class="parade" style="--parade-duration:${Math.max(12,Math.min(36,Math.round(state.members.length*1.45)))}s">${state.members.map(m=>`<div class="parade-member">${dollMarkup(m)}<div class="parade-name">${escapeHTML(memberName(m))}</div></div>`).join('')}</div></div><div class="ending-progress" aria-hidden="true"><div></div></div><div class="story-box" id="story-text">${escapeHTML(copy)}</div><div class="ending-facts"><div class="fact">${c.flag} 나라 · ${escapeHTML(c.name)}</div><div class="fact">🏛️ 수도 · ${escapeHTML(c.capital)}</div><div class="fact">🏠 ${escapeHTML(familyInfo().type)}</div></div><p class="story-caption" style="margin-top:13px">서로 다른 모습의 가족이 함께 떠나는 즐거운 여행!</p><div class="primary-actions"><button class="btn btn-white" data-action="speak">🔊 이야기 읽어주기</button><div class="btn-row" style="margin-top:0"><button class="btn btn-soft" data-action="go" data-step="2">다른 나라로 여행</button><button class="btn btn-primary" data-action="go" data-step="3">다시 옷 입히러 가기 ↺</button></div></div>`;}
function render(){
  if(state.step>=2&&personMembers().length===0)state.step=1;
  if(state.step>=3&&!currentCountry())state.step=2;
  const page=[intro,familyBuilder,countrySelect,dress,ending][state.step]||intro;
  $app.innerHTML=`<div class="app-shell safe-bottom">${top()}<div class="workspace"><main class="main panel">${page()}</main>${sidebar()}</div></div>`;
  const parade=$app.querySelector('.parade');
  const stage=$app.querySelector('.ending-stage');
  if(parade&&stage)parade.style.setProperty('--parade-shift',`${Math.max(0,parade.scrollWidth-stage.clientWidth+30)}px`);
  save();
}
function addMember(roleId){const role=ROLES.find(r=>r.id===roleId);if(!role)return;if(state.members.length>=24)return toast('한 번에 최대 24명·마리까지 만들 수 있어요.');const pet=role.type==='pet';const child=role.group==='child';const grand=role.group==='grand';const newMember={id:makeId(),role:role.id,nickname:'',skin:pet?0:1,hair:pet?'short':grand?'bob':child?'short':'long',hairColor:grand?5:0,face:'smile',shape:'round',outfitId:'',clothColor:state.members.length%CLOTH_COLORS.length,accessoryId:''};state.members.push(newMember);ui.selectedMemberId=newMember.id;notifyAndRender(`${role.label}을(를) 가족에 추가했어요!`);}
function advance(step){if(step===1&&state.playerName.trim().length===0){toast('먼저 내 이름을 입력해 주세요!');return;}if(step>=2&&personMembers().length===0){toast('의상을 입힐 사람을 한 명 이상 추가해 주세요.');return;}if(step>=3&&!currentCountry()){toast('여행할 나라를 골라 주세요!');return;}if(step>=4&&dressProgress().done!==dressProgress().total){toast('모든 사람에게 옷을 입혀 주세요!');return;}state.step=step;render();window.scrollTo({top:0,behavior:'instant'});}
function setStyle(field,value){const m=state.members.find(x=>x.id===(state.step===1?ui.selectedMemberId:ui.selectedDressId));if(!m)return;if(field==='skin'||field==='hairColor'||field==='clothColor'){const v=Number(value);if(!Number.isInteger(v)||v<0||v>5)return;m[field]=v;}else if(field==='hair'&&HAIRS.some(x=>x.id===value)){m.hair=value;}else if(field==='face'&&FACES.some(x=>x.id===value)){m.face=value;}else if(field==='shape'&&SHAPES.some(x=>x.id===value)){m.shape=value;}else if(field==='nickname'){m.nickname=String(value||'').slice(0,18);}save();render();}
function nextDressMember(){const currentIndex=state.members.findIndex(m=>m.id===ui.selectedDressId);const all=state.members;let next=all.slice(currentIndex+1).concat(all.slice(0,currentIndex+1)).find(m=>typeOf(m)==='person'&&!isDressed(m));if(!next)next=all[(currentIndex+1)%all.length];if(next){ui.selectedDressId=next.id;render();}}
function speak(){const copy=storyText();if(!('speechSynthesis'in window)){toast('이 브라우저는 음성 읽기를 지원하지 않아요.');return;}try{speechSynthesis.cancel();const utter=new SpeechSynthesisUtterance(copy);utter.lang='ko-KR';utter.rate=.88;utter.pitch=1.14;speechSynthesis.speak(utter);toast('이야기를 읽고 있어요 🔊');}catch(e){toast('음성 읽기를 시작하지 못했어요.');}}
$app.addEventListener('click',ev=>{const target=ev.target.closest('[data-action]');if(!target)return;const {action,id,role,field,value,step,region}=target.dataset;
  switch(action){
    case 'start':{const el=document.getElementById('player-name');state.playerName=(el?.value||'').trim().slice(0,20);if(!state.playerName){toast('내 이름을 먼저 입력해 주세요!');el?.focus();return;}advance(1);break;}
    case 'add-role':addMember(role);break;
    case 'choose-member':ui.selectedMemberId=id;render();break;
    case 'dress-member':ui.selectedDressId=id;render();break;
    case 'remove-member':{const m=state.members.find(x=>x.id===id);if(!m)return;if(!confirm(`${memberName(m)}을(를) 가족판에서 빼낼까요?`))return;state.members=state.members.filter(x=>x.id!==id);ui.selectedMemberId=state.members[0]?.id||null;notifyAndRender('가족판을 수정했어요.');break;}
    case 'go':advance(Number(step));break;
    case 'region':ui.region=region;render();break;
    case 'select-country':{if(state.countryId!==id){if(state.members.some(m=>m.outfitId)&&!confirm('나라를 바꾸면 지금까지 고른 의상이 초기화돼요. 바꿀까요?'))return;state.members.forEach(m=>{m.outfitId='';m.accessoryId='';});state.countryId=id;}notifyAndRender('이 나라의 전통옷을 입어 봐요!');break;}
    case 'style':setStyle(field,value);break;
    case 'outfit':{const m=state.members.find(x=>x.id===ui.selectedDressId);const c=currentCountry();if(!m||!c||typeOf(m)!=='person'||!c.outfits.some(o=>o.id===id))return;m.outfitId=id;notifyAndRender('잘 어울려요! ✨');break;}
    case 'accessory':{const m=state.members.find(x=>x.id===ui.selectedDressId);const c=currentCountry();if(!m||!c||!(id===''||c.accessories.some(a=>a.id===id)))return;m.accessoryId=id;notifyAndRender('소품을 골랐어요!');break;}
    case 'next-member':nextDressMember();break;
    case 'finish':advance(4);break;
    case 'speak':speak();break;
    case 'reset':if(confirm('처음부터 새 게임을 시작할까요? 지금 가족과 옷 선택이 지워져요.')){window.speechSynthesis?.cancel?.();state=defaultState();ui={region:'전체',search:'',selectedMemberId:null,selectedDressId:null};render();}break;
    case 'help':alert('놀이 방법\n\n1. 내 이름만 적어요.\n2. 가족판에 원하는 가족과 반려동물을 추가해요. 얼굴·피부색·머리 모양을 고를 수 있어요.\n3. 나라를 하나 선택해요.\n4. 사람마다 전통의상을 고르고 반려동물에는 소품을 골라요.\n5. 완성하면 가족이 함께 걷는 여행 애니메이션과 나라·의상·수도 이야기를 볼 수 있어요.\n\n* 가족 유형은 구성만 보고 추정하는 놀이용 표시입니다.\n* 실제 전통의상은 지역과 공동체에 따라 달라요.');break;
  }
});
$app.addEventListener('change',ev=>{const t=ev.target;const field=t.dataset.field;if(['nickname','face','hair','shape'].includes(field))setStyle(field,t.value);});
$app.addEventListener('input',ev=>{const t=ev.target;if(t.id==='country-search'){ui.search=t.value;const grid=document.getElementById('country-grid');if(grid)grid.innerHTML=countryCards();}});
$app.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&ev.target.id==='player-name'){ev.preventDefault();$app.querySelector('[data-action="start"]')?.click();}});
if(!window.__GAME_SINGLE_FILE && 'serviceWorker'in navigator&&/^https?:$/.test(location.protocol)){navigator.serviceWorker.register('./sw.js').catch(()=>{});}
render();
// Exposed only for non-destructive local automated checks.
window.FamilyDressupDebug={getState:()=>structuredClone(state),getCatalog:()=>COUNTRIES.map(c=>({id:c.id,name:c.name,capital:c.capital,outfitCount:c.outfits.length})),getFamilyInfo:()=>familyInfo()};
})();

</script>
