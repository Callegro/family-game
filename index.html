async function renderWardrobe(){const person=current();if(!person)return;const panel=$('wardrobeGrid');panel.className='wardrobe-grid'+(['skin','hairColor'].includes(state.tab)?' skin-grid':'');panel.replaceChildren();const ticket=(panel._ticket||0)+1;panel._ticket=ticket;const tab=state.tab;

function wireDrag(card,tab,num,thumb){card.addEventListener('pointerdown',ev=>{if(ev.button!==undefined&&ev.button!==0)return;drag={id:ev.pointerId,startX:ev.clientX,startY:ev.clientY,x:ev.clientX,y:ev.clientY,card,tab,num,thumb,ghost:null};try{card.setPointerCapture(ev.pointerId)}catch(_){}});

async function fetchLayerImages(person){const srcs=[['base',basePath(person),person.skin],['shoes',person.worn.shoes!==null?partPath(person,'shoes'):null,person.worn.shoes],['top',person.worn.top!==null?partPath(person,'top'):null,person.worn.top],['bottom',person.worn.bottom!==null?partPath(person,'bottom'):null,person.worn.bottom],['hair',person.hair&&!arabHeadCovered(person)?hairPath(person,person.hair):null,person.hairColor]];

function photoText(){const owner=$('ownerName').value.trim();const subject=owner?owner+'의 가족들은 ':'우리 가족은 ';const c=countryInfo();if(c.capital){const particle=word=>{const last=word.charCodeAt(word.length-1);return (last>=0xAC00&&last<=0xD7A3)&&((last-0xAC00)%28!==0)?'을':'를'};return subject+c.id+'의 전통옷인 '+c.clothes+particle(c.clothes)+' 입고 '+c.id+'의 수도인 '+c.capital+particle(c.capital)+' 방문했어요.'}

// PNG 내부의 실제 캐릭터 발 끝과 머리 시작 위치 (투명 여백 제외).

function imageAlphaBounds(img){

   let count=0;for(let x=0;x<110;x++)if(d[(y*110+x)*4+3]>105)count++;

async function photo(){

 const ticket=++state.photoSeq;show('result');

 $('resultCaption').textContent=photoText();

 const bg=await load(backgroundPath());if(ticket!==state.photoSeq)return;
 if(bg){try{fitCover(ctx,bg,c.width,c.height)}catch(_){drawFallback(ctx,c.width,c.height)}}else drawFallback(ctx,c.width,c.height);
 ctx.fillStyle='#ffffff13';ctx.fillRect(0,0,c.width,c.height);
 const n=state.people.length,margin=55,available=c.width-2*margin,cell=available/n;

  if(ticket!==state.photoSeq)return;
  const p=state.people[i],parts=await fetchLayerImages(p),type=charInfo(p).id;
  const factor=type.startsWith('아이')?.80:type.startsWith('학생')?.91:1;

  // 1인 사진도 이름이 머리 위로 들어갈 수 있도록 상단에 여유를 둡니다.

  const bounds=imageAlphaBounds(parts.base&&parts.base.image);
  const py=floorY-bounds.bottom*ph;
  try{drawComposed(ctx,parts,px,py,pw,ph)}catch(e){}

  const font=clamp(cell*.20,19,33);
  ctx.font='bold '+font+'px "Apple SD Gothic Neo","Malgun Gothic",sans-serif';
  ctx.fillStyle='#fff';ctx.strokeStyle='#634d66c9';ctx.lineWidth=6;ctx.lineJoin='round';ctx.textAlign='center';
  const nameY=Math.max(font+10,headY-12);
  ctx.strokeText(p.name||charInfo(p).label,margin+cell*(i+.5),nameY,cell*.97);

}
function drawFallback(ctx,w,h){const grad=ctx.createLinearGradient(0,0,0,h);grad.addColorStop(0,'#d9edf4');grad.addColorStop(.72,'#ffeddb');grad.addColorStop(1,'#c5debd');ctx.fillStyle=grad;ctx.fillRect(0,0,w,h);ctx.fillStyle='#ffffff88';for(let i=0;i<7;i++){ctx.beginPath();ctx.arc((i*283+180)%w,100+(i%3)*47,65+i*3,0,2*Math.PI);ctx.fill()}ctx.fillStyle='#c4dfa9';ctx.fillRect(0,h*.88,w,h*.12)}

function savePhoto(){const p=$('photoCanvas'),c=document.createElement('canvas');c.width=1600;c.height=1010;const ctx=c.getContext('2d');try{ctx.drawImage(p,0,0);ctx.fillStyle='#fffaf8';ctx.fillRect(0,860,1600,150);ctx.font='bold 43px "Apple SD Gothic Neo",sans-serif';ctx.fillStyle='#825b78';ctx.textAlign='center';const lines=splitText(ctx,photoText(),1490);const start=900-(lines.length-1)*24;lines.forEach((line,i)=>ctx.fillText(line,800,start+48*i));const link=document.createElement('a');link.download='우리_가족_'+state.country+'_여행.png';link.href=c.toDataURL('image/png');link.click();toast('🌷 가족사진을 저장했어요')}catch(e){toast('Safari에서 사진을 길게 눌러 저장해 주세요')}}
